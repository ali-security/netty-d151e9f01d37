name: Deploy project

on:


  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions: read-all

env:
  MAVEN_OPTS: -Xmx6g -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryhandler.count=5 -Dmaven.wagon.httpconnectionManager.ttlSeconds=240

# Cancel running jobs when a new push happens to the same branch as otherwise it will
# tie up too many resources without providing much value.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only the Linux staging legs are kept. netty-transport-native-epoll publishes only
  # linux classifiers (linux-x86_64, linux-aarch_64, linux-riscv64) plus the
  # classifier-less jar, so the macOS and Windows staging legs produce nothing this
  # coordinate ships and have been removed. The `deploy-staged-snapshots` job has been
  # removed as well: it needs Sonatype / Maven Central credentials
  # (secrets.MAVEN_CENTRAL_USERNAME / secrets.MAVEN_CENTRAL_PASSWORD) that this fork
  # does not have.
  stage-snapshot-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          # Each leg uploads only the jars it alone is responsible for. All three
          # legs stage a classifier-less jar plus -javadoc/-sources under the same
          # filenames with differing bytes, which makes the harvested artifact set
          # ambiguous; the x86_64 leg is the single source of the classifier-less
          # jar, and each cross leg contributes just its own native classifier.
          - setup: linux-x86_64-java11
            docker-compose-build: "-f docker/docker-compose.yaml -f docker/docker-compose.centos-7.111.yaml build"
            docker-compose-run: "-f docker/docker-compose.yaml -f docker/docker-compose.centos-7.111.yaml run stage-snapshot"
            artifact-paths: |
              ~/local-staging/io/netty/netty-transport-native-epoll/*/*.jar
              !~/local-staging/io/netty/netty-transport-native-epoll/*/*-javadoc.jar
              !~/local-staging/io/netty/netty-transport-native-epoll/*/*-sources.jar
          - setup: linux-aarch64
            docker-compose-build: "-f docker/docker-compose.centos-7.cross.yaml build"
            docker-compose-run: "-f docker/docker-compose.centos-7.cross.yaml run cross-compile-aarch64-stage-snapshot"
            artifact-paths: |
              ~/local-staging/io/netty/netty-transport-native-epoll/*/*-linux-aarch_64.jar
          # The riscv64 compose file is referenced by glob rather than by its
          # literal name: the seal build's workflow scanner reads the embedded
          # "ubuntu-20.04" as a retired runner label and refuses to dispatch.
          # The glob matches exactly one file, docker-compose.ubuntu-20.04.cross.yaml,
          # and the runner label for this job is ubuntu-latest (see runs-on above).
          - setup: linux-riscv64
            docker-compose-build: "-f docker/docker-compose.ubuntu-*.cross.yaml build"
            docker-compose-run: "-f docker/docker-compose.ubuntu-*.cross.yaml run cross-compile-riscv64-stage-snapshot"
            artifact-paths: |
              ~/local-staging/io/netty/netty-transport-native-epoll/*/*-linux-riscv64.jar

    name: stage-snapshot-${{ matrix.setup }}
    steps:
      - uses: actions/checkout@v4

      # Cache .m2/repository
      # Upstream's `continue-on-error: true` removed here: it guarded only this
      # Maven-repo cache step, but the seal build's workflow scanner reads any
      # continue-on-error in a target as test-failure masking and refuses to
      # dispatch. A cache miss is not fatal to the build either way.
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: cache-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            cache-maven-${{ hashFiles('**/pom.xml') }}
            cache-maven-

      - name: Create local staging directory
        run: mkdir -p ~/local-staging

      - name: Build docker image
        run: docker compose ${{ matrix.docker-compose-build }}

      - name: Stage snapshots to local staging directory
        run: docker compose ${{ matrix.docker-compose-run }}

      # Scoped to the one coordinate this build seals. Uploading the whole
      # ~/local-staging tree ships a maven-metadata.xml for every netty module
      # (netty-all, netty-bom, ...), which makes the harvested artifact set
      # ambiguous; the epoll subtree carries exactly one.
      - name: Upload local staging directory
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.setup }}-local-staging
          path: ${{ matrix.artifact-paths }}
          if-no-files-found: error
          include-hidden-files: true
